[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charliepy"
version = "2.1.2"
description = "Ensemble Machine Learning Algorithm to rival XGBoost and RandomForest"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Gary Hutson", email = "hutsons-hacks@outlook.com" }
]

license = { text = "MIT" }

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.23,<3.0",
  "scikit-learn>=1.2,<2.0",
  "pandas>=1.5,<3.0",
  "scipy>=1.9,<2.0",
  "joblib>=1.2",
  "threadpoolctl>=3.1",
  "xgboost>=1.7,<4.0",
  "statsmodels>=0.13,<1.0",
  "optuna>=3.0,<5.0",
  "prophet>=1.1,<2.0",
  "torch>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "black",
  "ruff",
]

viz = [
  "seaborn>=0.12, <1.0",
]

[project.urls]
Homepage = "https://github.com/StatsGary/charlie"
Source = "https://github.com/StatsGary/charlie"
Issues = "https://github.com/StatsGary/charlie/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["charlie*"]
